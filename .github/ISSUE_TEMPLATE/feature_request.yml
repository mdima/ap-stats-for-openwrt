# GitHub issue FORM — Feature request.
# YAML issue-form schema (name/description/body), 2-space indent.
name: Feature request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please skim the public out-of-scope / vNext list in the
        project [README Roadmap](../../README.md#roadmap) — some ideas are
        already deferred candidates, and an informed request is easier to act on.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem are you trying to solve? Describe the scenario, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? (Optional — describe the behaviour, not the implementation.)
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you are using today, or other approaches you weighed.
    validations:
      required: false
