name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Test with coverage
        # Phase 7 / Plan 07-03 — `-- --filter-not-trait "Category=Smoke"` excludes the
        # Testcontainers-bound smoke tests from the default run so the 80/80 line +
        # branch coverage gate (irongut/CodeCoverageSummary below) is unaffected by
        # the smoke surface. The smoke tests run separately in the `smoke-tests` job.
        run: |
          dotnet test --no-build -c Release \
            --coverage \
            --coverage-output-format cobertura \
            --coverage-output coverage.cobertura.xml \
            -- --filter-not-trait "Category=Smoke"

      - name: Locate coverage artifact
        id: locate-coverage
        run: |
          # Microsoft.Testing.Extensions.CodeCoverage emits coverage.cobertura.xml inside
          # the test project's TestResults directory. Surface it at the workflow root for
          # CodeCoverageSummary to consume by a stable path.
          set -euo pipefail
          path=$(find . -name 'coverage.cobertura.xml' -print -quit)
          if [[ -z "${path}" ]]; then
            echo "No coverage.cobertura.xml found under the workspace" >&2
            exit 1
          fi
          if [[ "${path}" != "./coverage.cobertura.xml" ]]; then
            cp "${path}" coverage.cobertura.xml
          fi
          echo "path=coverage.cobertura.xml" >> "$GITHUB_OUTPUT"

      - name: Enforce 80% line + 80% branch coverage
        # WR-02 review fix: SHA-pinned (supply-chain hardening for public repo).
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.cobertura.xml
          badge: false
          fail_below_min: true
          format: markdown
          thresholds: '80 80'        # line, branch — independent (CI-03)
          output: both

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.cobertura.xml

  # Phase 7 / Plan 07-03 — sibling smoke-tests job. Pinned to ubuntu-latest because
  # only the Linux runners ship a Docker daemon in the GitHub-hosted pool; macOS /
  # Windows runners do NOT match this label so the job is skipped at the workflow
  # level (visible in the run UI) rather than at the test level (which would
  # silently pass). RESEARCH Risks #1.
  #
  # Smoke tests are NOT included in the 80/80 coverage gate (RESEARCH Finding #10)
  # — this job runs without `--coverage` and uses `--filter-trait "Category=Smoke"`
  # to invert the test job's filter.
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      # Phase 21 / Plan 21-04 — M-HRD-04 D-05/D-06. The Microsoft.Playwright NuGet package
      # ships only the managed driver, not the Chromium binary. CspBrowserSmokeTests (the
      # CSP browser gate) needs Chromium provisioned in the fresh runner before the smoke
      # run, otherwise Playwright throws "Executable doesn't exist". chromium ONLY (not all
      # browsers) to minimize download; ubuntu-latest ships pwsh. This job stays coverage-
      # exempt (no --coverage), same as the smoke run below.
      - name: Install Playwright Chromium
        run: pwsh ApStatsForOpenWrt.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Smoke tests (requires Docker daemon)
        run: |
          dotnet test --no-build -c Release \
            -- --filter-trait "Category=Smoke"
